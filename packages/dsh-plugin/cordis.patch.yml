- insert:
    - id: dsh-guard
      name: '@dsh-guard/companion'
      inject: [webServer, tools, agents, agentDefaultModel]
      config:
        profile: web
        statusPollMs: 15000
        denyTools: []
        askTools: []
        actionPolicyEnabled: false
        workspaceRoots: []
        allowedNetworkDomains: []
        askUnknownTools: true
        actionEventMaxBytes: 5242880
        actionEventMaxFiles: 4
